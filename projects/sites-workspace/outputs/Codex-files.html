function render(){const data=visibleRows(),q=$('#search').value.trim().toLowerCase();let items=data.filter(r=>current?(q?r.path.startsWith(current+sep):parent(r.path)===current):(q?true:roots.some(x=>x.path===r.path)));if(q)items=items.filter(r=>(baseName(r.path)+' '+r.tag).toLowerCase().includes(q));items.sort((a,b)=>{if(a.folder!==b.folder)return a.folder?-1:1;const va=sort==='tag'?a.tag:sort==='type'?type(a):baseName(a.path),vb=sort==='tag'?b.tag:sort==='type'?type(b):baseName(b.path);return va.localeCompare(vb,'ko')*(ascending?1:-1)});const list=$('#list');list.replaceChildren();for(const r of items){const tr=document.createElement('tr');tr.tabIndex=0;tr.dataset.path=r.path;tr.className=selected?.path===r.path?'chosen':'';const name=document.createElement('td'),i=document.createElement('span');i.className='icon';i.textContent=icon(r);name.append(i,document.createTextNode(!current&&!q?rootName(r.path):baseName(r.path)));const t=document.createElement('td');t.textContent=type(r);const tags=document.createElement('td');if(r.tag){const tag=document.createElement('span');tag.className='tag';tag.textContent=r.tag;tags.append(tag)}tr.append(name,t,tags);tr.onclick=()=>selectItem(r);tr.ondblclick=()=>openItem(r);tr.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openItem(r)}if(e.key===' '){e.preventDefault();selectItem(r)}if(e.key==='ArrowDown'){e.preventDefault();tr.nextElementSibling?.focus()}if(e.key==='ArrowUp'){e.preventDefault();tr.previousElementSibling?.focus()}};tr.oncontextmenu=e=>{e.preventDefault();selectItem(r);const m=$('#menu');m.hidden=false;m.style.left=Math.min(e.clientX,innerWidth-160)+'px';m.style.top=Math.min(e.clientY,innerHeight-100)+'px'};list.append(tr)}$('#empty').hidden=items.length>0;$('#count').textContent=items.length+'개 항목';$('#heading').textContent=q?'검색 결과':current?rootName(current)===current?baseName(current):rootName(current):'내 작업';$('#location').textContent=simple?'일상용 파일':'개발 파일 포함';tree();crumbs();details()}
function mode(value){simple=value;$('#simple').setAttribute('aria-pressed',String(value));$('#all').setAttribute('aria-pressed',String(!value));if(current&&!visibleRows().some(r=>r.path===current&&r.folder))current='';selected=null;render()}
$('#simple').onclick=()=>mode(true);$('#all').onclick=()=>mode(false);$('#search').oninput=()=>{selected=null;render()};$('#expand').onclick=()=>{visibleRows().filter(r=>r.folder).forEach(r=>expanded.add(r.path));tree()};$('#collapse').onclick=()=>{expanded.clear();tree()};$('#back').onclick=()=>{if(position>0)navigate(history[--position],false)};$('#forward').onclick=()=>{if(position<history.length-1)navigate(history[++position],false)};$('#up').onclick=()=>{if(current)navigate(roots.some(r=>r.path===current)?'':parent(current))};$('#open').onclick=()=>openItem(selected);$('#contextOpen').onclick=()=>openItem(selected);$('#contextInfo').onclick=()=>{$('#details').hidden=false;details()};document.addEventListener('click',()=>$('#menu').hidden=true);
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ascending=sort===b.dataset.sort?!ascending:true;sort=b.dataset.sort;render()});function view(grid){$('#items').classList.toggle('cards',grid);$('#gridView').setAttribute('aria-pressed',String(grid));$('#listView').setAttribute('aria-pressed',String(!grid))}$('#gridView').onclick=()=>view(true);$('#listView').onclick=()=>view(false);$('#detailToggle').onclick=()=>{const d=$('#details');d.hidden=!d.hidden;$('#detailToggle').setAttribute('aria-pressed',String(!d.hidden))};
$('#address').ondblclick=e=>{if(e.target.closest('button'))return;$('#crumbs').hidden=true;$('#pathInput').style.display='block';$('#pathInput').value=current;$('#pathInput').focus();$('#pathInput').select()};function exitPath(){$('#crumbs').hidden=false;$('#pathInput').style.display='none'}$('#pathInput').onkeydown=e=>{if(e.key==='Enter'){const path=e.target.value.replace(/[\\/]+$/,'');if(!path||visibleRows().some(r=>r.folder&&r.path===path)){navigate(path);exitPath()}else $('#message').textContent='목록에 포함된 폴더 경로를 입력하세요.'}if(e.key==='Escape')exitPath()};$('#pathInput').onblur=exitPath;
const quick=$('#quick');[['내 작업',''],...roots.map(r=>[rootName(r.path),r.path])].forEach(([name,p])=>{const b=document.createElement('button');b.className='treeName';b.style.display='block';b.style.width='100%';b.textContent='☆ '+name;b.onclick=()=>navigate(p);quick.append(b)});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();$('#search').focus()}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();$('#back').click()}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();$('#forward').click()}if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();$('#up').click()}if(e.key==='Escape')$('#menu').hidden=true});$('#resize').onpointerdown=e=>{e.target.setPointerCapture(e.pointerId);const move=ev=>$('#sidebar').style.width=Math.max(130,Math.min(480,ev.clientX))+'px';e.target.onpointermove=move;e.target.onpointerup=()=>e.target.onpointermove=null};$('#resize').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){$('#sidebar').style.width=Math.max(130,Math.min(480,$('#sidebar').offsetWidth+(e.key==='ArrowRight'?20:-20)))+'px'}};render();
</script></body></html>
